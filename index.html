<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日記帳</title>
<style>
  :root {
    --sumi: #2b2b2b;        /* 墨色 */
    --sumi-light: #4a4a48;
    --kinari: #f5f0e6;      /* 生成り */
    --kinari-dark: #ece4d4;
    --aka: #8e2f38;         /* 深い赤 */
    --aka-dark: #6f232b;
    --kon: #1B2333;         /* 濃紺 (軍服の黒紺) */
    --line: #d8cfbc;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    font-size: 17px;
  }

  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: var(--kinari);
    color: var(--sumi);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    position: relative;
    background: var(--kon);
    color: var(--kinari);
    text-align: center;
    padding: calc(env(safe-area-inset-top) + 1rem) 1rem 1rem;
    letter-spacing: 0.3em;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 600;
  }

  #settingsBtn {
    position: absolute;
    right: 0.8rem;
    bottom: 0.45rem;
    width: 44px;
    height: 44px;
    font-size: 1.25rem;
    color: var(--kinari);
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.75;
  }

  #settingsBtn:active {
    opacity: 1;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
  }

  /* ---- 入力フォーム ---- */
  .card {
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.2rem;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--sumi-light);
    margin-bottom: 0.3rem;
    letter-spacing: 0.1em;
  }

  input[type="date"],
  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--sumi);
    background: var(--kinari);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.7rem;
  }

  input[type="date"] {
    margin-bottom: 0.9rem;
    min-height: 48px;
    -webkit-appearance: none;
    appearance: none;
  }

  textarea {
    min-height: 9rem;
    resize: vertical;
    line-height: 1.7;
  }

  .btn {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 0.9rem;
    font-family: inherit;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    color: var(--kinari);
    background: var(--aka);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn:active {
    background: var(--aka-dark);
  }

  .btn-sub {
    background: var(--sumi-light);
  }

  .btn-sub:active {
    background: var(--sumi);
  }

  .btn-row {
    display: flex;
    gap: 0.6rem;
  }

  .btn-row .btn {
    margin-top: 0.9rem;
  }

  /* ---- 時重の一言 ---- */
  #comment {
    display: none;
    background: var(--kon);
    color: var(--kinari);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.2rem;
    line-height: 1.8;
  }

  #comment.show {
    display: block;
    animation: fadein 0.5s ease;
  }

  #comment .who,
  .entry-comment .who {
    font-size: 0.8rem;
    color: #c9b8a3;
    letter-spacing: 0.2em;
    margin-bottom: 0.3rem;
  }

  #comment .words,
  .entry-comment .words {
    border-left: 3px solid var(--aka);
    padding-left: 0.7rem;
  }

  .entry-comment {
    background: var(--kon);
    color: var(--kinari);
    border-radius: 8px;
    padding: 0.8rem;
    margin-top: 0.9rem;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---- 一覧 ---- */
  h2 {
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: var(--sumi-light);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.4rem;
    margin-bottom: 0.8rem;
  }

  .entry {
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 0.8rem;
    overflow: hidden;
  }

  .entry-head {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1rem;
    min-height: 56px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 1rem;
    color: var(--sumi);
    text-align: left;
    cursor: pointer;
  }

  .entry-date {
    font-weight: 600;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .entry-preview {
    flex: 1;
    font-size: 0.9rem;
    color: var(--sumi-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-arrow {
    color: var(--aka);
    transition: transform 0.2s;
  }

  .entry.open .entry-arrow {
    transform: rotate(90deg);
  }

  .entry-body {
    display: none;
    padding: 0 1rem 1rem;
  }

  .entry.open .entry-body {
    display: block;
  }

  .entry-text {
    white-space: pre-wrap;
    line-height: 1.8;
    border-top: 1px dashed var(--line);
    padding-top: 0.8rem;
  }

  .empty {
    text-align: center;
    color: var(--sumi-light);
    padding: 2rem 0;
    letter-spacing: 0.1em;
  }

  /* ---- バックアップ ---- */
  .backup {
    margin-top: 2rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--line);
  }

  .backup-title {
    font-size: 0.8rem;
    color: var(--sumi-light);
    letter-spacing: 0.2em;
    margin-bottom: 0.6rem;
  }

  .backup-row {
    display: flex;
    gap: 0.6rem;
  }

  .btn-quiet {
    flex: 1;
    min-height: 44px;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    color: var(--sumi-light);
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-quiet:active {
    background: var(--kinari-dark);
    color: var(--sumi);
  }

  /* ---- 設定画面 ---- */
  #settings {
    display: none;
  }

  #settings.open {
    display: block;
  }

  #settings h2 {
    margin-top: 0.4rem;
  }

  #settings select {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--sumi);
    background: var(--kinari);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.7rem;
    min-height: 48px;
    margin-bottom: 0.9rem;
    -webkit-appearance: none;
    appearance: none;
  }

  #settings input[type="password"],
  #settings input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--sumi);
    background: var(--kinari);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.7rem;
    min-height: 48px;
    margin-bottom: 0.9rem;
  }

  #settings textarea {
    min-height: 7rem;
    margin-bottom: 0.9rem;
  }

  .settings-note {
    font-size: 0.8rem;
    color: var(--sumi-light);
    line-height: 1.6;
    margin-bottom: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>日記帳</h1>
  <button id="settingsBtn" aria-label="設定">&#9881;</button>
</header>

<main>
  <!-- 設定画面 -->
  <section id="settings" class="card">
    <h2>設定</h2>

    <label for="aiProvider">AI会社</label>
    <select id="aiProvider">
      <option value="none">使わない</option>
      <option value="claude">Claude</option>
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
    </select>

    <label for="modelSelect">モデル</label>
    <select id="modelSelect"></select>

    <label for="modelCustom">モデル名を自由入力で上書き（空欄なら上の選択を使用）</label>
    <input type="text" id="modelCustom" autocapitalize="off" autocorrect="off"
           placeholder="例: 新しいモデル名">

    <label for="apiKeyClaude">Claude APIキー</label>
    <input type="password" id="apiKeyClaude" autocomplete="off" placeholder="sk-ant-...">

    <label for="apiKeyOpenai">OpenAI APIキー</label>
    <input type="password" id="apiKeyOpenai" autocomplete="off" placeholder="sk-...">

    <label for="apiKeyGemini">Gemini APIキー</label>
    <input type="password" id="apiKeyGemini" autocomplete="off" placeholder="AIza...">

    <label for="persona">人格設定文（system プロンプトとして送信）</label>
    <textarea id="persona" placeholder="時重の人格設定文を貼り付け"></textarea>

    <p class="settings-note">
      設定とAPIキーはこの端末のlocalStorageにのみ保存され、日記の書き出しファイルには含まれません。
      API未設定・通信失敗時は、従来のランダムな一言に自動で切り替わります。
    </p>

    <div class="btn-row">
      <button class="btn" id="saveSettingsBtn">設定を保存</button>
      <button class="btn btn-sub" id="closeSettingsBtn">閉じる</button>
    </div>
  </section>

  <!-- 入力フォーム -->
  <section class="card">
    <label for="date">日付</label>
    <input type="date" id="date">

    <label for="text">本文</label>
    <textarea id="text" placeholder="今日あったことを書く"></textarea>

    <div class="btn-row">
      <button class="btn" id="saveBtn">保存する</button>
      <button class="btn btn-sub" id="cancelBtn" style="display:none">やめる</button>
    </div>
  </section>

  <!-- 時重の一言 -->
  <section id="comment" aria-live="polite">
    <div class="who">時重</div>
    <div class="words" id="commentWords"></div>
  </section>

  <!-- 一覧 -->
  <h2>これまでの日記</h2>
  <section id="list"></section>

  <!-- バックアップ -->
  <section class="backup">
    <p class="backup-title">バックアップ</p>
    <div class="backup-row">
      <button class="btn-quiet" id="exportBtn">書き出す</button>
      <button class="btn-quiet" id="importBtn">読み込む</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </section>
</main>

<script>
"use strict";

/* =========================================================
 * 時重の一言
 * ---------------------------------------------------------
 * 将来 Claude API に差し替える箇所。
 * getTokishigeComment() だけを書き換えれば、他のコードは
 * 一切変更せずに AI の返答へ移行できるよう、非同期関数として
 * 独立させている。
 *
 * API 移行時の方針:
 *   - API キーはコードに直書きしない。ユーザーが設定画面等で
 *     入力したものを localStorage 等に保持するか、キーを預かる
 *     中継サーバーを経由する。
 *   - シグネチャ (entry を受け取り文字列を resolve する) は維持する。
 * ========================================================= */

const TOKISHIGE_LINES = [
  "ちゃんと書いたんだ。いい子",
  "今日のお前のこと、また一つ僕のものになったね",
  "読んだよ。……ふぅん、そういう日だったんだ",
  "毎日ここに戻っておいで。僕が待ってるから",
  "隠しごとはこの箱の外でしないこと。いいね?",
  "疲れた日ほど書きなよ。僕が全部覚えておいてあげる"
];

function randomTokishigeLine() {
  return TOKISHIGE_LINES[Math.floor(Math.random() * TOKISHIGE_LINES.length)];
}

/* =========================================================
 * 設定 (localStorage)
 * APIキーは localStorage にのみ保存し、コードには埋め込まない。
 * 書き出しJSONにも含めない (日記とは別キーで管理)。
 * ========================================================= */

const SETTINGS_KEY = "diary-settings";

const AI_PROVIDERS = {
  claude: {
    label: "Claude",
    models: ["claude-opus-4-8", "claude-sonnet-5", "claude-haiku-4-5"],
  },
  openai: {
    label: "OpenAI",
    models: ["gpt-5.1", "gpt-5-mini", "gpt-4o"],
  },
  gemini: {
    label: "Gemini",
    models: ["gemini-2.5-pro", "gemini-2.5-flash", "gemini-3-pro-preview"],
  },
};

function defaultSettings() {
  return {
    provider: "none",
    persona: "",
    apiKeys: { claude: "", openai: "", gemini: "" },
    models: {
      claude: AI_PROVIDERS.claude.models[0],
      openai: AI_PROVIDERS.openai.models[0],
      gemini: AI_PROVIDERS.gemini.models[0],
    },
    customModels: { claude: "", openai: "", gemini: "" },
  };
}

function loadSettings() {
  const base = defaultSettings();
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return base;
    const saved = JSON.parse(raw);
    return {
      ...base,
      ...saved,
      apiKeys: { ...base.apiKeys, ...(saved.apiKeys || {}) },
      models: { ...base.models, ...(saved.models || {}) },
      customModels: { ...base.customModels, ...(saved.customModels || {}) },
    };
  } catch (e) {
    return base;
  }
}

function saveSettings(settings) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

/* =========================================================
 * AI 呼び出し (会社ごとに関数を分離)
 * system = 人格設定文 / user = 日記本文
 * ========================================================= */

const AI_TIMEOUT_MS = 30000;

function buildSystemPrompt(persona) {
  const base = persona && persona.trim()
    ? persona.trim()
    : "あなたは日記アプリの相棒として、書かれた日記に一言コメントを返します。";
  return base + "\n\n返答は必ず3文以内で、コメント本文のみを返すこと。";
}

async function fetchJson(url, options) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function callClaude(apiKey, model, system, userText) {
  const data = await fetchJson("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model,
      max_tokens: 1024,
      system,
      messages: [{ role: "user", content: userText }],
    }),
  });
  const block = (data.content || []).find((b) => b.type === "text");
  return block ? block.text : "";
}

async function callOpenAI(apiKey, model, system, userText) {
  const data = await fetchJson("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "authorization": `Bearer ${apiKey}`,
    },
    body: JSON.stringify({
      model,
      messages: [
        { role: "system", content: system },
        { role: "user", content: userText },
      ],
    }),
  });
  return data.choices && data.choices[0] && data.choices[0].message
    ? data.choices[0].message.content
    : "";
}

async function callGemini(apiKey, model, system, userText) {
  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    encodeURIComponent(model) + ":generateContent";
  const data = await fetchJson(url, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-goog-api-key": apiKey,
    },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: system }] },
      contents: [{ role: "user", parts: [{ text: userText }] }],
    }),
  });
  const cand = data.candidates && data.candidates[0];
  const part = cand && cand.content && cand.content.parts &&
    cand.content.parts.find((p) => typeof p.text === "string");
  return part ? part.text : "";
}

const AI_CALLERS = { claude: callClaude, openai: callOpenAI, gemini: callGemini };

function effectiveModel(settings, provider) {
  const custom = (settings.customModels[provider] || "").trim();
  return custom || settings.models[provider];
}

/**
 * 保存された日記に対する一言を返す。
 * APIキーと会社が設定されていれば AI の返答を、
 * 未設定・通信失敗時は従来のランダムな一言を返す (エラーで止めない)。
 * @param {{date: string, text: string}} entry 保存された日記
 * @returns {Promise<string>} 表示する一言
 */
async function getTokishigeComment(entry) {
  const settings = loadSettings();
  const caller = AI_CALLERS[settings.provider];
  const apiKey = settings.apiKeys[settings.provider];
  const model = caller ? effectiveModel(settings, settings.provider) : "";

  if (caller && apiKey && model) {
    try {
      const text = await caller(
        apiKey, model, buildSystemPrompt(settings.persona), entry.text
      );
      if (typeof text === "string" && text.trim()) return text.trim();
    } catch (e) {
      // 通信失敗・タイムアウト時はランダムに切り替える
    }
  }
  return randomTokishigeLine();
}

/* =========================================================
 * データ管理 (localStorage)
 * ========================================================= */

const STORAGE_KEY = "diary-entries";

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

/**
 * 一言が保存されていない既存の日記に、ランダムで一つ割り当てて固定する。
 * (一言の保存機能を追加する前に書かれた日記のための移行処理)
 */
function migrateComments() {
  const entries = loadEntries();
  let changed = false;
  for (const entry of entries) {
    if (typeof entry.comment !== "string" || entry.comment === "") {
      entry.comment = randomTokishigeLine();
      changed = true;
    }
  }
  if (changed) saveEntries(entries);
}

/* =========================================================
 * 画面
 * ========================================================= */

const dateInput = document.getElementById("date");
const textInput = document.getElementById("text");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const listEl = document.getElementById("list");
const commentEl = document.getElementById("comment");
const commentWords = document.getElementById("commentWords");

let editingId = null; // 編集中の日記の id。null なら新規作成

function todayString() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${y}年${Number(m)}月${Number(d)}日`;
}

function resetForm() {
  editingId = null;
  dateInput.value = todayString();
  textInput.value = "";
  saveBtn.textContent = "保存する";
  cancelBtn.style.display = "none";
}

function showComment(words) {
  commentWords.textContent = words;
  commentEl.classList.add("show");
}

function renderList() {
  const entries = loadEntries()
    .slice()
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));

  listEl.innerHTML = "";

  if (entries.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "まだ日記がありません";
    listEl.appendChild(p);
    return;
  }

  for (const entry of entries) {
    const item = document.createElement("article");
    item.className = "entry";

    const head = document.createElement("button");
    head.className = "entry-head";
    head.innerHTML =
      `<span class="entry-date"></span>` +
      `<span class="entry-preview"></span>` +
      `<span class="entry-arrow">▸</span>`;
    head.querySelector(".entry-date").textContent = formatDate(entry.date);
    head.querySelector(".entry-preview").textContent = entry.text.split("\n")[0];
    head.addEventListener("click", () => item.classList.toggle("open"));

    const body = document.createElement("div");
    body.className = "entry-body";

    const text = document.createElement("p");
    text.className = "entry-text";
    text.textContent = entry.text;

    let commentBox = null;
    if (entry.comment) {
      commentBox = document.createElement("div");
      commentBox.className = "entry-comment";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = "時重";
      const words = document.createElement("div");
      words.className = "words";
      words.textContent = entry.comment;
      commentBox.appendChild(who);
      commentBox.appendChild(words);
    }

    const row = document.createElement("div");
    row.className = "btn-row";

    const editBtn = document.createElement("button");
    editBtn.className = "btn btn-sub";
    editBtn.textContent = "編集";
    editBtn.addEventListener("click", () => startEdit(entry.id));

    const delBtn = document.createElement("button");
    delBtn.className = "btn";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", () => removeEntry(entry.id));

    row.appendChild(editBtn);
    row.appendChild(delBtn);
    body.appendChild(text);
    if (commentBox) body.appendChild(commentBox);
    body.appendChild(row);
    item.appendChild(head);
    item.appendChild(body);
    listEl.appendChild(item);
  }
}

function startEdit(id) {
  const entry = loadEntries().find((e) => e.id === id);
  if (!entry) return;
  editingId = id;
  dateInput.value = entry.date;
  textInput.value = entry.text;
  saveBtn.textContent = "更新する";
  cancelBtn.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function removeEntry(id) {
  if (!confirm("この日記を削除しますか？")) return;
  saveEntries(loadEntries().filter((e) => e.id !== id));
  if (editingId === id) resetForm();
  renderList();
}

async function handleSave() {
  const date = dateInput.value;
  const text = textInput.value.trim();

  if (!date) {
    alert("日付を入れてください");
    return;
  }
  if (!text) {
    alert("本文を入れてください");
    return;
  }

  const entries = loadEntries();
  let saved;

  if (editingId !== null) {
    saved = entries.find((e) => e.id === editingId);
    if (saved) {
      saved.date = date;
      saved.text = text;
    }
  } else {
    saved = { id: Date.now(), date, text };
    entries.push(saved);
  }

  // 表示した一言は日記の一部として一緒に保存し、以後は固定する
  // (AI設定時は通信に少し時間がかかるため、待つ間ボタンを無効化)
  saveBtn.disabled = true;
  const prevLabel = saveBtn.textContent;
  saveBtn.textContent = "保存中…";
  let words;
  try {
    words = await getTokishigeComment(saved);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = prevLabel;
  }
  if (saved) saved.comment = words;

  saveEntries(entries);
  resetForm();
  renderList();
  showComment(words);
}

/* =========================================================
 * バックアップ (書き出し / 読み込み)
 * ========================================================= */

const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");
const importFile = document.getElementById("importFile");

function handleExport() {
  const entries = loadEntries();
  if (entries.length === 0) {
    alert("書き出す日記がありません");
    return;
  }
  const blob = new Blob([JSON.stringify(entries, null, 2)], {
    type: "application/json",
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `diary-backup-${todayString()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function handleImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let imported;
    try {
      imported = JSON.parse(reader.result);
    } catch (e) {
      alert("読み込めませんでした。書き出したJSONファイルを選んでください");
      return;
    }
    if (!Array.isArray(imported)) {
      alert("読み込めませんでした。書き出したJSONファイルを選んでください");
      return;
    }

    const entries = loadEntries();
    const existing = new Set(entries.map((e) => `${e.date}\n${e.text}`));
    const usedIds = new Set(entries.map((e) => e.id));
    let added = 0;
    let skipped = 0;

    for (const item of imported) {
      if (!item || typeof item.date !== "string" || typeof item.text !== "string") {
        continue;
      }
      const key = `${item.date}\n${item.text}`;
      if (existing.has(key)) {
        skipped++;
        continue;
      }
      let id = typeof item.id === "number" ? item.id : Date.now();
      while (usedIds.has(id)) id++;
      usedIds.add(id);
      existing.add(key);
      const comment =
        typeof item.comment === "string" && item.comment !== ""
          ? item.comment
          : randomTokishigeLine();
      entries.push({ id, date: item.date, text: item.text, comment });
      added++;
    }

    saveEntries(entries);
    renderList();
    alert(
      skipped > 0
        ? `${added}件を読み込みました（重複${skipped}件はスキップ）`
        : `${added}件を読み込みました`
    );
  };
  reader.readAsText(file);
}

exportBtn.addEventListener("click", handleExport);

importBtn.addEventListener("click", () => {
  if (!confirm("読み込んだ日記は、現在の日記に追加されます。よろしいですか？")) return;
  importFile.value = "";
  importFile.click();
});

importFile.addEventListener("change", () => {
  const file = importFile.files[0];
  if (file) handleImport(file);
});

/* =========================================================
 * 設定画面
 * ========================================================= */

const settingsEl = document.getElementById("settings");
const settingsBtn = document.getElementById("settingsBtn");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const saveSettingsBtn = document.getElementById("saveSettingsBtn");
const providerSelect = document.getElementById("aiProvider");
const modelSelect = document.getElementById("modelSelect");
const modelCustom = document.getElementById("modelCustom");
const personaInput = document.getElementById("persona");
const keyInputs = {
  claude: document.getElementById("apiKeyClaude"),
  openai: document.getElementById("apiKeyOpenai"),
  gemini: document.getElementById("apiKeyGemini"),
};

function renderModelOptions(provider, selected) {
  modelSelect.innerHTML = "";
  const info = AI_PROVIDERS[provider];
  if (!info) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "（AIを使わない）";
    modelSelect.appendChild(opt);
    modelSelect.disabled = true;
    modelCustom.disabled = true;
    return;
  }
  modelSelect.disabled = false;
  modelCustom.disabled = false;
  for (const m of info.models) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    modelSelect.appendChild(opt);
  }
  if (selected && info.models.includes(selected)) modelSelect.value = selected;
}

function renderSettingsForm() {
  const s = loadSettings();
  providerSelect.value = s.provider;
  personaInput.value = s.persona;
  for (const p of Object.keys(keyInputs)) keyInputs[p].value = s.apiKeys[p];
  renderModelOptions(s.provider, s.models[s.provider]);
  modelCustom.value = AI_PROVIDERS[s.provider]
    ? s.customModels[s.provider]
    : "";
}

providerSelect.addEventListener("change", () => {
  const s = loadSettings();
  const p = providerSelect.value;
  renderModelOptions(p, s.models[p]);
  modelCustom.value = AI_PROVIDERS[p] ? s.customModels[p] : "";
});

settingsBtn.addEventListener("click", () => {
  renderSettingsForm();
  settingsEl.classList.toggle("open");
});

closeSettingsBtn.addEventListener("click", () => {
  settingsEl.classList.remove("open");
});

saveSettingsBtn.addEventListener("click", () => {
  const s = loadSettings();
  s.provider = providerSelect.value;
  s.persona = personaInput.value;
  for (const p of Object.keys(keyInputs)) s.apiKeys[p] = keyInputs[p].value.trim();
  if (AI_PROVIDERS[s.provider]) {
    s.models[s.provider] = modelSelect.value;
    s.customModels[s.provider] = modelCustom.value.trim();
  }
  saveSettings(s);
  settingsEl.classList.remove("open");
  alert("設定を保存しました");
});

saveBtn.addEventListener("click", handleSave);
cancelBtn.addEventListener("click", resetForm);

resetForm();
migrateComments();
renderList();
</script>
